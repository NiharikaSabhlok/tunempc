[loggers]
keys=root,awebox,tunempc

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=consoleFormatter,fileFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler
qualname=root
propagate=0

[logger_awebox]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=awebox
propagate=0

[logger_tunempc]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=tunempc
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=consoleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=ERROR
formatter=fileFormatter
args=('combined.log','w',None,True)

[formatter_consoleFormatter]
format=%(levelname)s:	%(message)s
datefmt=

[formatter_fileFormatter]
format=%(levelname)s:			%(message)s
datefmt=
